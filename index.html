<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMMUNE PROTOCOL — Outbreak at the HUS Campus</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05080c; }
      #app { position: fixed; inset: 0; }
      #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #ui-root { position: absolute; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; color: #e6f4f1; }
      #ui-root * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" tabindex="0"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
