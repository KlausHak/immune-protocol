<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IMMUNE PROTOCOL — map debug view</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1016; color: #d8e6ee; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; }
      #wrap { display: flex; gap: 10px; padding: 4px; height: calc(100% - 8px); box-sizing: border-box; }
      canvas { image-rendering: pixelated; flex: none; }
      #side { flex: 1; overflow: auto; min-width: 280px; }
      #side h1 { font-size: 15px; margin: 2px 0 6px; color: #7fe3d6; }
      #side pre { white-space: pre-wrap; margin: 0 0 8px; }
      .err { color: #ff8a80; } .ok { color: #9be89b; }
      #legend span { display: inline-block; margin: 0 8px 2px 0; }
      #legend i { display: inline-block; width: 10px; height: 10px; margin-right: 3px; vertical-align: -1px; border: 1px solid #0006; }
      a { color: #7fc4e3; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="map"></canvas>
      <div id="side">
        <h1 id="title">map</h1>
        <div id="legend"></div>
        <pre id="report">validating…</pre>
      </div>
    </div>
    <script type="module" src="./map.ts"></script>
  </body>
</html>
