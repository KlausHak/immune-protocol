<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMMUNE PROTOCOL — VFX sandbox</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05080c; font-family: system-ui, sans-serif; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lbl { position: absolute; transform: translate(-50%, 0); color: #e8fbf8; font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
             padding: 1px 6px; border-radius: 4px; background: rgba(6, 18, 22, 0.62); border: 1px solid rgba(47, 214, 198, 0.35); white-space: nowrap; }
      #hud { position: fixed; left: 8px; top: 8px; color: #cfe; font: 12px/1.35 ui-monospace, monospace; background: rgba(0, 0, 0, 0.45);
             padding: 6px 8px; border-radius: 6px; pointer-events: none; white-space: pre; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="hud"></div>
    <script type="module" src="./vfx.ts"></script>
  </body>
</html>
