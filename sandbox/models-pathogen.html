<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox — pathogen models</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111418; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; font: 600 12px/1.2 system-ui, sans-serif; color: #f2e9ff; }
      .lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; padding: 2px 6px; border-radius: 4px;
             background: rgba(20, 10, 30, 0.62); border: 1px solid rgba(214, 75, 255, 0.45); text-shadow: 0 1px 2px #000; }
      .lbl.s { border-color: rgba(157, 255, 74, 0.45); }
      .lbl.d { border-color: rgba(200, 200, 200, 0.35); color: #ddd; }
      #hud { position: fixed; left: 10px; top: 8px; font: 12px/1.4 ui-monospace, monospace; color: #b9a6c9; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="hud"></div>
    <script type="module" src="./models-pathogen.ts"></script>
  </body>
</html>
